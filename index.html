<!DOCTYPE html>
<html lang="ko">
<head>

<meta property="og:title" content="헤아림 HearI'm">

<style>
  :root {
    --bg: #F6F4EF; --surface: #FFFFFF; --ink: #1F2933; --ink-2: #4A5560; --ink-3: #7B8794;

  .msg { padding: 12px 14px; border-radius: 12px; background: var(--brand-tint); color: var(--brand-dark); margin: 10px 0; }
  .msg.bad { background: var(--warn-tint); color: var(--warn); }
  .empty { text-align: center; color: var(--ink-3); padding: 28px 8px; }

  /* 첫 화면: 넓은 화면(PC)에서는 두 칸 — 왼쪽 참여·내 설문, 오른쪽 만들기 */
  [hidden] { display: none !important; }

    body.home .wrap { max-width: 1180px; padding: 28px 28px 56px; }
    .home-grid { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); grid-template-rows: auto 1fr; grid-template-areas: "join make" "mine make"; column-gap: 18px; align-items: start; }
    .h-join { grid-area: join; } .h-make { grid-area: make; } .h-mine { grid-area: mine; }

  }

  /* 참여 화면 */
  .q { font-size: 1.45em; font-weight: 800; line-height: 1.3; letter-spacing: -.01em; margin: 4px 0 16px; }
  .opt { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 15px 16px; margin-bottom: 10px; border: 2px solid var(--line); border-radius: 14px; background: #fff; font-weight: 700; font-size: 1.05em; }

  /* 막대 */
  .bar { margin-bottom: 12px; }

  .bar .lab span:last-child { color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .bar .track { height: 16px; background: var(--line-2); border-radius: 999px; overflow: hidden; }
  .bar .fill { height: 100%; width: 0; background: var(--brand); border-radius: 999px; transition: width .5s ease; }
  .bar.lead .fill { background: var(--accent); }
  .cmt { padding: 10px 12px; border-left: 4px solid var(--brand); background: var(--bg); border-radius: 0 10px 10px 0; margin-bottom: 8px; }
  .cmt small { color: var(--ink-3); display: block; }

  /* 적어서 내기: 답 구름 (같은 답이 모이면 글씨가 커짐) */
  select { font: inherit; color: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
  .cloud { display: flex; flex-wrap: wrap; gap: .45em .9em; align-items: center; justify-content: center; align-content: center; padding: 8px 0 14px; }
  .cloud .w { border: 0; background: none; padding: .08em .18em; font-weight: 800; line-height: 1.15; color: var(--brand-dark); font-size: max(15px, var(--fs, 1em)); transition: font-size .6s ease, color .3s; cursor: default; border-radius: .25em; font-family: inherit; }
  .cloud .w sup { font-size: .42em; font-weight: 700; opacity: .8; margin-left: .15em; }
  .cloud .w.c1 { color: var(--brand); } .cloud .w.c2 { color: var(--ink-2); }
  .cloud .w.lead { color: #9A6400; }
  .cloud .w.new { animation: pop .7s ease; }
  @keyframes pop { from { opacity: 0; transform: scale(.4); } 60% { transform: scale(1.12); } to { opacity: 1; transform: none; } }
  body.board .cloud { display: block; position: relative; height: 56vh; min-height: 300px; padding: 0; }
  body.board.show .cloud { height: 64vh; }
  body.board .cloud .w { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; transition: left .7s ease, top .7s ease, font-size .6s ease, color .3s; }
  body.board .cloud .w.new { animation-name: popc; }
  @keyframes popc { from { opacity: 0; transform: translate(-50%, -50%) scale(.4); } 60% { transform: translate(-50%, -50%) scale(1.12); } to { opacity: 1; transform: translate(-50%, -50%); } }
  .cloud-meas { position: absolute; left: -9999px; top: 0; visibility: hidden; white-space: nowrap; font-weight: 800; line-height: 1.15; padding: .08em .18em; }
  .b-fl { margin-top: 14px; padding: 14px 16px; border-radius: 14px; background: rgba(255,255,255,.07); color: #DDE3EA; font-size: 15px; }
  .b-fl p { margin: 0 0 10px; color: #AEB8C4; } .b-fl .row { justify-content: space-between; margin-top: 6px; }
  body.board.show #bfl { display: none; }
  details.guide { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 14px; }
  details.guide summary { cursor: pointer; font-weight: 700; }
  details.guide ul { margin: 10px 0 0; padding-left: 20px; color: var(--ink-2); font-size: 15px; line-height: 1.6; }
  .cloud-meas sup { font-size: .42em; margin-left: .15em; }
  body.board .cloud .w { color: #DDF3F3; } body.board .cloud .w.c1 { color: #8FDFE0; } body.board .cloud .w.c2 { color: #C9D1DB; }
  body.board .cloud .w.lead { color: #FFC857; }
  body.board .cloud.own .w { cursor: pointer; } body.board .cloud.own .w:hover { text-decoration: line-through; }
  @media (prefers-reduced-motion: reduce) { .cloud .w { transition: none; } .cloud .w.new { animation: none; } }

  /* 만든 설문 목록 */
  .poll { border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; background: #fff; }
  .poll h3 { margin: 0 0 4px; font-size: 1.05em; }
  .tag { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: .8em; font-weight: 700; background: var(--brand-tint); color: var(--brand-dark); }
  .tag.off { background: var(--line-2); color: var(--ink-3); }
  .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-weight: 700; letter-spacing: .08em; }

  /* 결과 화면 (큰 화면) */
  body.board { background: #12222B; color: #F4F2EE; }
  body.board .wrap { max-width: none; padding: 3.2vh 3.2vw; min-height: 100vh; display: flex; flex-direction: column; }
  .b-top { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 2vh; }
  .b-top .logo { color: #F4F2EE; font-size: clamp(18px, 2.2vw, 34px); }
  .b-top .logo b { color: #5FD0D2; }
  .b-ctl { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  body.board .btn { background: transparent; border-color: #3B4E58; color: #C9D1DB; }
  body.board .btn:hover { border-color: #5FD0D2; color: #fff; }
  body.board .btn.on { background: #5FD0D2; border-color: #5FD0D2; color: #12222B; }
  .b-main { flex: 1; display: grid; grid-template-columns: minmax(220px, 26vw) 1fr; gap: 3.2vw; align-items: start; }
  .b-join { background: #fff; color: var(--ink); border-radius: 22px; padding: 2vw; text-align: center; }
  .b-join svg { width: 100%; height: auto; display: block; }
  .b-join .how { font-weight: 800; font-size: clamp(15px, 1.5vw, 26px); margin: 1vh 0 .4vh; }
  .b-join .url { color: var(--ink-2); font-size: clamp(12px, 1.05vw, 18px); word-break: break-all; }
  .b-join .code { font-size: clamp(22px, 2.6vw, 44px); color: var(--brand-dark); }
  .b-q { font-size: clamp(26px, 3.6vw, 64px); font-weight: 900; line-height: 1.2; letter-spacing: -.02em; margin: 0 0 2.4vh; }
  .b-count { color: #9FB0BA; font-size: clamp(15px, 1.5vw, 26px); margin-bottom: 2.4vh; font-variant-numeric: tabular-nums; }
  .b-count b { color: #FFC857; font-size: 1.5em; }
  body.board .bar { margin-bottom: 2vh; }
  body.board .bar .lab { font-size: clamp(17px, 1.9vw, 34px); }
  body.board .bar .lab span:last-child { color: #C9D1DB; }
  body.board .bar .track { height: clamp(18px, 2.6vh, 38px); background: #22363F; }
  body.board .bar .fill { background: #5FD0D2; }
  body.board .bar.lead .fill { background: #FFC857; }
  .b-cmts { margin-top: 2.4vh; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); gap: 12px; }
  body.board .cmt { background: #1B303A; border-left-color: #5FD0D2; font-size: clamp(15px, 1.35vw, 24px); margin: 0; }
  body.board .cmt small { color: #9FB0BA; }
  .b-closed { display: inline-block; padding: 4px 14px; border-radius: 999px; background: #B5402D; color: #fff; font-weight: 800; font-size: clamp(13px, 1.2vw, 20px); margin-left: 10px; vertical-align: middle; }
  /* 발표 모드: 로고와 단추를 빼고 질문·QR·막대만 꽉 차게 (주소에 &show=1) */
  .b-exit { display: none; }
  body.board.show .b-top { display: none; }
  body.board.show .wrap { padding: 4.5vh 4vw; }
  body.board.show .b-main { grid-template-columns: minmax(240px, 30vw) 1fr; align-items: center; gap: 4vw; }
  body.board.show .b-q { font-size: clamp(30px, 4.2vw, 76px); }
  body.board.show .b-exit { display: inline-flex; position: fixed; top: 10px; right: 10px; opacity: .18; z-index: 5; }
  body.board.show .b-exit:hover, body.board.show .b-exit:focus-visible { opacity: 1; }
  @media (max-width: 820px) { .b-main, body.board.show .b-main { grid-template-columns: 1fr; } .b-join { max-width: 300px; margin: 0 auto; } }
  @media (prefers-reduced-motion: reduce) { .bar .fill { transition: none; } }
</style>

<div class="wrap" id="app"><p class="empty">불러오는 중…</p></div>
<script src="config.js"></script>
<script src="qrcode.js"></script>
<script>
/* 헤아림 HearI'm — 실시간 설문
   참여: ?p=설문번호 (가입·설치 없음, 파이어베이스 SDK 없이 주소로 바로 읽고 씀 → 참여 인원이 많아도 가벼움)
   결과 화면: ?b=설문번호 (큰 화면용, 실시간)   ·   만들기: 첫 화면에서 구글 로그인
   자리: polls/{번호}/meta (질문·보기·열림), polls/{번호}/votes/{참여자 번호} = { c: 고른 보기, t: 한 줄 의견, at }
         users/{uid}/polls/{번호} = 만든 때 */
const VERSION = '1.3.0';
const MAX_POLLS = 30;   // 한 사람이 만들어 둘 수 있는 설문 수 (무료 저장 공간을 함께 쓰므로)
const CFG = window.HEARIM_CONFIG || null;
const FB_SDK = 'https://www.gstatic.com/firebasejs/10.14.1';
const Q = new URLSearchParams(location.search);
const $ = function(id){ return document.getElementById(id); };
const app = $('app');
const esc = function(v){ return String(v == null ? '' : v).replace(/[&<>"']/g, function(ch){ return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch]; }); };
const n = function(v){ return Number(v || 0).toLocaleString('ko-KR'); };
const CODE_RE = /^[a-z0-9]{6}$/;
const ALPHA = 'abcdefghjkmnpqrstuvwxyz23456789';   // 헷갈리는 글자(i·l·o·0·1) 뺌
const rnd = function(len, set){ const a = new Uint32Array(len); crypto.getRandomValues(a); let s = ''; for (let i = 0; i < len; i++) s += set[a[i] % set.length]; return s; };
const BASE = location.origin + location.pathname;
const joinUrl = function(code){ return BASE + '?p=' + code; };
const boardUrl = function(code){ return BASE + '?b=' + code; };
const ls = { get: function(k){ try { return localStorage.getItem(k); } catch (e) { return null; } }, set: function(k, v){ try { localStorage.setItem(k, v); } catch (e) {} } };
const optsOf = function(meta){ const o = meta && meta.opts; if (!o) return []; return (Array.isArray(o) ? o : Object.keys(o).sort().map(function(k){ return o[k]; })).filter(function(x){ return x != null; }); };
const logo = '<a class="logo" href="' + esc(BASE) + '"><img src="icon.svg" alt="" width="64" height="64">헤아림<small>Hear<b>I&#39;m</b></small></a>';

/* ---- 주소로 바로 읽고 쓰기 (참여 화면) ---- */
function rest(path, opt){
  return fetch(CFG.databaseURL.replace(/\/$/, '') + '/' + path + '.json', opt || {}).then(function(r){
    return r.json().catch(function(){ return null; }).then(function(j){
      if (!r.ok) { const e = new Error(j && j.error || ('HTTP ' + r.status)); e.status = r.status; throw e; }
      return j;
    });
  });
}

/* ---- 적어서 내기(주관식) ---- */
const isText = function(meta){ return !!meta && meta.type === 'text'; };
const maxOf = function(meta){ return Math.min(5, Math.max(1, Number(meta && meta.max) || 1)); };
const listOf = function(o){ if (!o) return []; return Array.isArray(o) ? o : Object.keys(o).sort(function(a, b){ return a - b; }).map(function(k){ return o[k]; }); };
// 답에는 글자(한글·영어 등)와 숫자만 남김 — 기호·그림 문자는 뺌
const cleanAns = function(s){ let k = String(s == null ? '' : s); try { k = k.replace(new RegExp('[^\\p{L}\\p{N}\\s]', 'gu'), ''); } catch (e) { k = k.replace(/[!-\/:-@\[-`{-~]/g, ''); } return k.replace(/\s+/g, ' ').trim().slice(0, 20); };
const ansOf = function(v){ return listOf(v && v.a).filter(function(x){ return typeof x === 'string'; }).map(cleanAns).filter(Boolean); };
const hideOf = function(meta){ return listOf(meta && meta.hide).filter(function(x){ return typeof x === 'string' && x; }); };
// 같은 답으로 셀 기준: 띄어쓰기·문장부호·영어 대소문자만 다른 답
const normAns = function(s){ let k = String(s).toLowerCase(); try { k = k.replace(new RegExp('[\\s\\p{P}\\p{S}]', 'gu'), ''); } catch (e) { k = k.replace(/\s/g, ''); } return k || String(s).trim().toLowerCase(); };
// 거친 말 거르기: 걸러진 답은 지워지지 않고 화면에만 안 나옴 (만든 사람이 '보이기'로 되살릴 수 있음)
const BAD_RE = [
  /[시씨쓰쒸슈쉬씌][발벌빨팔뻘]/, /ㅅㅂ|ㅆㅂ|ㅂㅅ|ㅈㄹ|ㅈㄴ|ㅁㅊ|ㄲㅈ|ㄷㅊ/, /병신|븅신|빙신/, /지랄|쥐랄/, /새끼|새키|쉐끼|쌔끼|섀끼/,
  /좆|좃|졷|존나|졸라|줜나/, /개(같|새|소리|놈|년)/, /미친(놈|년|새)/, /닥쳐|꺼져|뒤져|뒈져|죽여버|죽어라/, /느금|니애미|엠창|니미럴/,
  /썅|쌍놈|쌍년|염병|엿먹|등신|찐따|또라이|돌아이/, /섹스|야동|변태/, /틀딱|급식충|맘충|김치녀|한남충/, /fuck|shit|bitch|porn|asshole|sex/
];
const BAD_WORD = { '자지': 1, '보지': 1, '섹': 1, 'ㅗ': 1, 'ㅗㅗ': 1 };
const isBad = function(s){
  let k = String(s == null ? '' : s).toLowerCase();
  try { k = k.replace(new RegExp('[^\\p{L}\\s]', 'gu'), ''); } catch (e) { k = k.replace(/[0-9!-\/:-@\[-`{-~]/g, ''); }
  const tok = k.split(/\s+/).filter(Boolean); if (!tok.length) return false;
  const hit = function(w){ return !!BAD_WORD[w] || BAD_RE.some(function(r){ return r.test(w); }); };
  // 낱말마다 살핌("다시 발표"는 통과). 한 글자씩 띄어 쓴 것("시 발")만 붙여서 한 번 더 살핌
  return tok.some(hit) || (tok.length > 1 && tok.every(function(w){ return w.length <= 1; }) && hit(tok.join('')));
};
const hashOf = function(s){ let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h; };
function tallyText(meta, votes){
  const hid = {}, allow = {}, map = {}, items = []; let total = 0;
  // hide 목록: 그냥 적힌 것은 숨긴 답, + 로 시작하면 걸러졌지만 만든 사람이 보이게 한 답
  hideOf(meta).forEach(function(k){ if (k.charAt(0) === '+') allow[k.slice(1)] = 1; else hid[k] = 1; });
  Object.keys(votes || {}).map(function(k){ return votes[k]; }).filter(function(v){ return v && ansOf(v).length; }).sort(function(a, b){ return (a.at || 0) - (b.at || 0); }).forEach(function(v){
    total++; const seen = {};
    ansOf(v).forEach(function(a){
      const k = normAns(a); if (seen[k]) return; seen[k] = 1; if (hid[k]) return;
      let it = map[k]; if (!it) { it = map[k] = { key: k, label: a, count: 0, forms: {} }; items.push(it); }
      it.count++; it.forms[a] = (it.forms[a] || 0) + 1; if (it.forms[a] > (it.forms[it.label] || 0)) it.label = a;
    });
  });
  const vis = [], flagged = [];

const sizeOf = function(it, t){ return t.max > 1 ? Math.sqrt((it.count - 1) / (t.max - 1)) : .3; };
// 참여 화면용: 한 번 그리는 구름
function cloudHtml(t){

  return '<div class="cloud">' + t.items.slice().sort(function(a, b){ return b.count - a.count; }).slice(0, 40).map(function(it){
    return '<span class="w c' + (hashOf(it.key) % 3) + (t.max > 1 && it.count === t.max ? ' lead' : '') + '" style="--fs:' + (1 + 1.3 * sizeOf(it, t)).toFixed(2) + 'em">' + esc(it.label) + (it.count > 1 ? '<sup>' + it.count + '</sup>' : '') + '</span>';

// 결과 화면용: 글자를 화면 여기저기에 흩어 놓음. 있던 글자는 제자리에서 커지고(겹치면 비켜 감), 새 답은 빈 곳에 새로 나타남
let cloudMeas = null;
function cloudUpdate(el, t, onPick){
  let list = t.items.map(function(it, i){ it.i = i; return it; });
  if (list.length > 60) list = list.slice().sort(function(a, b){ return b.count - a.count || b.i - a.i; }).slice(0, 60).sort(function(a, b){ return a.i - b.i; });
  const f = list.length > 40 ? .7 : list.length > 20 ? .85 : 1, have = {}, keep = {}, first = !el.dataset.on;
  el.dataset.on = '1';
  Array.prototype.forEach.call(el.children, function(c){ have[c.dataset.k] = c; });
  const W = el.clientWidth || 600, H = el.clientHeight || 300, vw = window.innerWidth / 100;
  if (!cloudMeas) { cloudMeas = document.createElement('span'); cloudMeas.className = 'cloud-meas'; document.body.appendChild(cloudMeas); }
  list.forEach(function(it){
    let w = have[it.key];
    if (!w) {
      w = document.createElement('button'); w.type = 'button'; w.className = 'w c' + (hashOf(it.key) % 3) + (first ? '' : ' new'); w.dataset.k = it.key;
      w.appendChild(document.createElement('span')); w.appendChild(document.createElement('sup'));
      w.addEventListener('click', function(){ onPick(it.key); }); el.appendChild(w);
    }
    keep[it.key] = 1; it.el = w;
    // 글자 크기(px)와 차지할 넓이를 미리 잼. 너무 길면 칸 안에 들어가게 줄임
    let px = Math.max(15, (1.9 + 3.4 * sizeOf(it, t)) * f * vw);
    cloudMeas.innerHTML = esc(it.label) + (it.count > 1 ? '<sup>' + it.count + '</sup>' : '');
    cloudMeas.style.fontSize = px + 'px'; let bw = cloudMeas.offsetWidth;
    if (bw > W * .92) { px = Math.max(12, px * W * .92 / bw); cloudMeas.style.fontSize = px + 'px'; bw = cloudMeas.offsetWidth; }
    it.w = bw; it.h = cloudMeas.offsetHeight;
    w.style.setProperty('--fs', px.toFixed(1) + 'px');
    w.classList.toggle('lead', t.max > 1 && it.count === t.max);
    w.firstChild.textContent = it.label; w.lastChild.textContent = it.count > 1 ? it.count : '';
    w.setAttribute('aria-label', it.label + ' ' + it.count + '명');
  });
  Object.keys(have).forEach(function(k){ if (!keep[k]) have[k].remove(); });
  // 자리 잡기: 큰 글자부터. 제자리가 비어 있으면 그대로, 겹치면 빈 곳을 찾아 옮김
  const placed = [], gap = 10;
  const over = function(x, y, it){ let o = 0; for (let k = 0; k < placed.length; k++) { const p = placed[k], dx = (it.w + p.w) / 2 + gap - Math.abs(x - p.x), dy = (it.h + p.h) / 2 + gap - Math.abs(y - p.y); if (dx > 0 && dy > 0) o += dx * dy; } return o; };
  const clamp = function(v, half, size){ return size <= half * 2 ? size / 2 : Math.min(size - half, Math.max(half, v)); };
  list.slice().sort(function(a, b){ return b.count - a.count || a.i - b.i; }).forEach(function(it){
    const w = it.el, old = w._p; let x = 0, y = 0, ok = false;
    if (old) { x = clamp(old.x * W, it.w / 2, W); y = clamp(old.y * H, it.h / 2, H); ok = !over(x, y, it); }
    if (!ok) {
      let best = Infinity, bx = W / 2, by = H / 2;
      for (let n = 0; n < 260; n++) {
        const spread = Math.min(1, .35 + n / 120);
        const cx = clamp(W / 2 + (Math.random() - .5) * W * spread, it.w / 2, W), cy = clamp(H / 2 + (Math.random() - .5) * H * spread, it.h / 2, H), o = over(cx, cy, it);
        if (o < best) { best = o; bx = cx; by = cy; if (!o) break; }
      }
      x = bx; y = by;
    }
    w._p = { x: x / W, y: y / H }; placed.push({ x: x, y: y, w: it.w, h: it.h });
    w.style.left = (x / W * 100).toFixed(2) + '%'; w.style.top = (y / H * 100).toFixed(2) + '%';
  });
}

/* ---- 표 세기 ---- */
function tally(meta, votes){
  const opts = optsOf(meta), counts = opts.map(function(){ return 0; }), cmts = [];
  Object.keys(votes || {}).forEach(function(k){
    const v = votes[k]; if (!v || typeof v.c !== 'number' || v.c < 0 || v.c >= opts.length) return;
    counts[v.c]++; if (v.t && String(v.t).trim() && !isBad(v.t)) cmts.push({ t: String(v.t).trim(), c: v.c, at: v.at || 0 });
  });
  cmts.sort(function(a, b){ return b.at - a.at; });
  const total = counts.reduce(function(a, b){ return a + b; }, 0);
  return { opts: opts, counts: counts, total: total, max: Math.max.apply(null, counts.concat([0])), cmts: cmts };
}
function barsHtml(t){
  return t.opts.map(function(o, i){
    const c = t.counts[i], pct = t.total ? Math.round(c / t.total * 100) : 0;
    return '<div class="bar' + (c > 0 && c === t.max ? ' lead' : '') + '"><div class="lab"><span>' + esc(o) + '</span><span>' + n(c) + '명 · ' + pct + '%</span></div><div class="track"><div class="fill" style="width:' + pct + '%"></div></div></div>';
  }).join('');
}

/* ---- QR ---- */
function qrSvg(text){
  if (typeof qrcode !== 'function') return '';
  const q = qrcode(0, 'M'); q.addData(text); q.make();
  const c = q.getModuleCount(); let d = '';
  for (let y = 0; y < c; y++) for (let x = 0; x < c; x++) if (q.isDark(y, x)) d += 'M' + x + ' ' + y + 'h1v1h-1z';
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 ' + (c + 4) + ' ' + (c + 4) + '" shape-rendering="crispEdges" role="img" aria-label="참여 QR"><rect x="-2" y="-2" width="' + (c + 4) + '" height="' + (c + 4) + '" fill="#fff"/><path d="' + d + '" fill="#1F2933"/></svg>';
}

function armed(btn, text, run){
  const orig = btn.textContent; let t = 0;
  btn.addEventListener('click', function(){
    if (btn.classList.contains('armed')) { clearTimeout(t); btn.classList.remove('armed'); btn.textContent = orig; run(); return; }
    btn.classList.add('armed'); btn.textContent = text;
    t = setTimeout(function(){ btn.classList.remove('armed'); btn.textContent = orig; }, 3000);
  });
}

      .map(function(v){ return [new Date(v.at || 0).toLocaleString('ko-KR'), opts[v.c] || '', v.t || ''].map(q).join(','); });
    const text = '﻿' + ['때', '고른 보기', '한 줄 의견'].map(q).join(',') + '\n' + rows.join('\n') + '\n';
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'text/csv;charset=utf-8' })); a.download = '헤아림_' + code + '.csv'; document.body.appendChild(a); a.click(); a.remove();
  }
}

/* ---- 시작 ---- */
(function(){
  if (!CFG || !CFG.databaseURL) { app.innerHTML = '<div class="top">' + logo + '</div><div class="card"><h1>아직 연결 전이에요</h1><p class="hint">파이어베이스 연결 정보(config.js)를 넣으면 쓸 수 있어요.</p></div>'; return; }
  const p = (Q.get('p') || '').toLowerCase(), b = (Q.get('b') || '').toLowerCase();
  if (CODE_RE.test(b)) pageBoard(b); else if (CODE_RE.test(p)) pageJoin(p); else pageHome();
})();
</script>
