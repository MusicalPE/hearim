<style>
  :root {
    --bg: #F6F4EF; --surface: #FFFFFF; --ink: #1F2933; --ink-2: #4A5560; --ink-3: #7B8794;
    --line: #E4E0D8; --line-2: #EFECE6; --brand: #0F8B8D; --brand-dark: #0B6E70; --brand-tint: #E3F4F4;
    --accent: #FFC857; --warn: #B5402D; --warn-tint: #FDEEEA; --r: 18px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: 'Pretendard', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif; background: var(--bg); color: var(--ink); line-height: 1.55; -webkit-font-smoothing: antialiased; word-break: keep-all; overflow-wrap: anywhere; }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 20px 16px 48px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
  .logo { display: inline-flex; align-items: center; flex: none; white-space: nowrap; font-weight: 900; font-size: 1.5em; letter-spacing: -.02em; color: var(--ink); text-decoration: none; }
  .logo b { color: var(--brand); }
  .logo img { width: 1.3em; height: 1.3em; flex: none; margin-right: .32em; border-radius: .3em; }
  .logo small { font-weight: 600; font-size: .5em; color: var(--ink-3); margin-left: 8px; letter-spacing: 0; align-self: flex-end; padding-bottom: .45em; }
  h1 { font-size: 1.7em; line-height: 1.25; margin: 0 0 6px; letter-spacing: -.02em; }
  h2 { font-size: 1.15em; margin: 0 0 10px; }
  .hint { color: var(--ink-3); font-size: .92em; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; margin-bottom: 14px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 46px; padding: 10px 18px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; text-decoration: none; color: var(--ink); }
  .btn:hover { border-color: var(--brand); color: var(--brand-dark); }
  .btn.main { background: var(--brand); border-color: var(--brand); color: #fff; }
  .btn.main:hover { background: var(--brand-dark); color: #fff; }
  .btn.sm { min-height: 38px; padding: 6px 14px; font-size: .92em; }
  .btn.danger { color: var(--warn); }
  .btn.danger.armed { background: var(--warn); border-color: var(--warn); color: #fff; }
  .btn:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  input[type=text], input[type=number], textarea { width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
  input[type=text]:focus, input[type=number]:focus, textarea:focus, select:focus { outline: 2px solid var(--brand); outline-offset: 1px; border-color: var(--brand); }
  label.f { display: block; font-weight: 700; margin: 14px 0 6px; }
  label.chk { display: flex; gap: 10px; align-items: flex-start; margin: 10px 0; cursor: pointer; }
  label.chk input { width: 20px; height: 20px; margin-top: 3px; accent-color: var(--brand); flex: none; }
  .msg { padding: 12px 14px; border-radius: 12px; background: var(--brand-tint); color: var(--brand-dark); margin: 10px 0; }
  .msg.bad { background: var(--warn-tint); color: var(--warn); }
  .empty { text-align: center; color: var(--ink-3); padding: 28px 8px; }

  /* 첫 화면: 넓은 화면(PC)에서는 두 칸 — 왼쪽 참여·내 설문, 오른쪽 만들기 */
  [hidden] { display: none !important; }
  @media (min-width: 980px) {
    body.home .wrap { max-width: 1180px; padding: 28px 28px 56px; }
    .home-grid { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); grid-template-rows: auto 1fr; grid-template-areas: "join make" "mine make"; column-gap: 18px; align-items: start; }
    .h-join { grid-area: join; } .h-make { grid-area: make; } .h-mine { grid-area: mine; }
    .home-grid .card { padding: 26px; }
  }

  /* 참여 화면 */
  .q { font-size: 1.45em; font-weight: 800; line-height: 1.3; letter-spacing: -.01em; margin: 4px 0 16px; }
  .opt { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 15px 16px; margin-bottom: 10px; border: 2px solid var(--line); border-radius: 14px; background: #fff; font-weight: 700; font-size: 1.05em; }
  .opt .dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--ink-3); flex: none; }
  .opt.on { border-color: var(--brand); background: var(--brand-tint); }
  .opt.on .dot { border-color: var(--brand); background: radial-gradient(circle, var(--brand) 0 45%, #fff 50%); }

  /* 막대 */
  .bar { margin-bottom: 12px; }
  .bar .lab { display: flex; justify-content: space-between; gap: 12px; font-weight: 700; margin-bottom: 4px; }
  .bar .lab span:last-child { color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .bar .track { height: 16px; background: var(--line-2); border-radius: 999px; overflow: hidden; }
  .bar .fill { height: 100%; width: 0; background: var(--brand); border-radius: 999px; transition: width .5s ease; }
  .bar.lead .fill { background: var(--accent); }
  .cmt { padding: 10px 12px; border-left: 4px solid var(--brand); background: var(--bg); border-radius: 0 10px 10px 0; margin-bottom: 8px; }
  .cmt small { color: var(--ink-3); display: block; }

  /* 적어서 내기: 답 구름 (같은 답이 모이면 글씨가 커짐) */
  select { font: inherit; color: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
  .cloud { display: flex; flex-wrap: wrap; gap: .45em .9em; align-items: center; justify-content: center; align-content: center; padding: 8px 0 14px; }
  .cloud .w { border: 0; background: none; padding: .08em .18em; font-weight: 800; line-height: 1.15; color: var(--brand-dark); font-size: max(15px, var(--fs, 1em)); transition: font-size .6s ease, color .3s; cursor: default; border-radius: .25em; font-family: inherit; }
  .cloud .w sup { font-size: .42em; font-weight: 700; opacity: .8; margin-left: .15em; }
  .cloud .w.c1 { color: var(--brand); } .cloud .w.c2 { color: var(--ink-2); }
  .cloud .w.lead { color: #9A6400; }
  .cloud .w.new { animation: pop .7s ease; }
  @keyframes pop { from { opacity: 0; transform: scale(.4); } 60% { transform: scale(1.12); } to { opacity: 1; transform: none; } }
  body.board .cloud { display: block; position: relative; height: 56vh; min-height: 300px; padding: 0; }
  body.board.show .cloud { height: 64vh; }
  body.board .cloud .w { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; transition: left .7s ease, top .7s ease, font-size .6s ease, color .3s; }
  body.board .cloud .w.new { animation-name: popc; }
  @keyframes popc { from { opacity: 0; transform: translate(-50%, -50%) scale(.4); } 60% { transform: translate(-50%, -50%) scale(1.12); } to { opacity: 1; transform: translate(-50%, -50%); } }
  .cloud-meas { position: absolute; left: -9999px; top: 0; visibility: hidden; white-space: nowrap; font-weight: 800; line-height: 1.15; padding: .08em .18em; }
  .b-fl { margin-top: 14px; padding: 14px 16px; border-radius: 14px; background: rgba(255,255,255,.07); color: #DDE3EA; font-size: 15px; }
  .b-fl p { margin: 0 0 10px; color: #AEB8C4; } .b-fl .row { justify-content: space-between; margin-top: 6px; }
  body.board.show #bfl { display: none; }
  .b-nav { display: flex; gap: 12px; align-items: center; justify-content: center; margin-top: 1.6vh; font-weight: 800; color: var(--ink); }
  .b-nav:empty { display: none; }
  details.guide { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 14px; }
  details.guide summary { cursor: pointer; font-weight: 700; }
  details.guide ul { margin: 10px 0 0; padding-left: 20px; color: var(--ink-2); font-size: 15px; line-height: 1.6; }
  .cloud-meas sup { font-size: .42em; margin-left: .15em; }
  body.board .cloud .w { color: #DDF3F3; } body.board .cloud .w.c1 { color: #8FDFE0; } body.board .cloud .w.c2 { color: #C9D1DB; }
  body.board .cloud .w.lead { color: #FFC857; }
  body.board .cloud.own .w { cursor: pointer; } body.board .cloud.own .w:hover { text-decoration: line-through; }
  @media (prefers-reduced-motion: reduce) { .cloud .w { transition: none; } .cloud .w.new { animation: none; } }

  /* 만든 설문 목록 */
  .poll { border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; background: #fff; }
  .poll h3 { margin: 0 0 4px; font-size: 1.05em; }
  .tag { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: .8em; font-weight: 700; background: var(--brand-tint); color: var(--brand-dark); }
  .tag.off { background: var(--line-2); color: var(--ink-3); }
  .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-weight: 700; letter-spacing: .08em; }

  /* 결과 화면 (큰 화면) */
  body.board { background: #12222B; color: #F4F2EE; }
  body.board .wrap { max-width: none; padding: 3.2vh 3.2vw; min-height: 100vh; display: flex; flex-direction: column; }
  .b-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px 16px; margin-bottom: 2vh; }
  .b-top .logo { color: #F4F2EE; font-size: clamp(18px, 2.2vw, 34px); }
  .b-top .logo b { color: #5FD0D2; }
  .b-ctl { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; flex: 1 1 auto; }
  body.board .btn { background: transparent; border-color: #3B4E58; color: #C9D1DB; }
  body.board .btn:hover { border-color: #5FD0D2; color: #fff; }
  body.board .btn.on { background: #5FD0D2; border-color: #5FD0D2; color: #12222B; }
  .b-main { flex: 1; display: grid; grid-template-columns: minmax(220px, 26vw) 1fr; gap: 3.2vw; align-items: start; }
  .b-join { background: #fff; color: var(--ink); border-radius: 22px; padding: 2vw; text-align: center; }
  .b-join svg { width: 100%; height: auto; display: block; }
  .b-join .how { font-weight: 800; font-size: clamp(15px, 1.5vw, 26px); margin: 1vh 0 .4vh; }
  .b-join .url { color: var(--ink-2); font-size: clamp(12px, 1.05vw, 18px); word-break: break-all; }
  .b-join .code { font-size: clamp(22px, 2.6vw, 44px); color: var(--brand-dark); }
  .b-q { font-size: clamp(26px, 3.6vw, 64px); font-weight: 900; line-height: 1.2; letter-spacing: -.02em; margin: 0 0 2.4vh; }
  .b-count { color: #9FB0BA; font-size: clamp(15px, 1.5vw, 26px); margin-bottom: 2.4vh; font-variant-numeric: tabular-nums; }
  .b-count b { color: #FFC857; font-size: 1.5em; }
  body.board .bar { margin-bottom: 2vh; }
  body.board .bar .lab { font-size: clamp(17px, 1.9vw, 34px); }
  body.board .bar .lab span:last-child { color: #C9D1DB; }
  body.board .bar .track { height: clamp(18px, 2.6vh, 38px); background: #22363F; }
  body.board .bar .fill { background: #5FD0D2; }
  body.board .bar.lead .fill { background: #FFC857; }
  /* 만들기 칸 위의 갈래: 설문 만들기 · 퀴즈 만들기 */
  .qb { border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px 16px; margin-top: 12px; background: #fff; }
  .qb-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 8px; min-height: 36px; }
  .qb-n { white-space: nowrap; font-weight: 800; color: var(--brand-dark); }
  .qb-r { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .q-mv { min-width: 0; padding-left: 12px; padding-right: 12px; }
  .opt.multi .dot { border-radius: 6px; position: relative; }
  .opt.multi.on .dot { background: var(--brand); }
  .opt.multi.on .dot::after { content: ''; position: absolute; left: 50%; top: 45%; width: 6px; height: 11px; margin: -6px 0 0 -3px; border: solid #fff; border-width: 0 2.5px 2.5px 0; transform: rotate(45deg); background: none; border-radius: 0; }
  .top-r { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
  .helpbtn { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; padding: 8px 6px; font: inherit; font-size: 15px; font-weight: 700; line-height: 1; color: var(--ink); cursor: pointer; }
  .helpbtn .t { display: inline-block; line-height: 22px; height: 22px; transform: translateY(-2px); }
  .helpbtn .q { transform: translateY(2px); }
  .helpbtn .q { width: 22px; height: 22px; border-radius: 50%; background: var(--ink); color: #fff; font-size: 14px; font-weight: 900; display: inline-flex; align-items: center; justify-content: center; line-height: 1; flex: 0 0 22px; }
  .helpbtn:hover { text-decoration: underline; }
  #sheet { position: fixed; inset: 0; z-index: 50; background: rgba(17, 24, 39, .55); display: flex; flex-direction: column; justify-content: flex-end; align-items: center; }
  #sheet[hidden] { display: none; }
  .sheet { width: 100%; max-width: 560px; max-height: 92dvh; overflow-y: auto; background: #fff; border-radius: 18px 18px 0 0; padding: 20px 20px 24px; display: flex; flex-direction: column; gap: 12px; }
  .sheet h2 { margin: 0; font-size: 20px; }
  .sheet section { border-top: 1px solid var(--line); padding-top: 10px; }
  .sheet h3 { margin: 0 0 6px; font-size: 16px; font-weight: 900; display: flex; align-items: center; gap: 8px; }
  .sheet h3 .num { width: 24px; height: 24px; border-radius: 6px; background: var(--brand-dark); color: #fff; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; }
  .sheet ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 5px; }
  .sheet li { font-size: 15px; line-height: 1.55; color: var(--ink-2); }
  @media (min-width: 900px) { #sheet { justify-content: center; } .sheet { border-radius: 18px; } }
  /* ---- 결과지 (한 장으로 인쇄) ---- */
  body.rp { background: #E9E6DF; }
  .rp-bar { max-width: 760px; margin: 16px auto 0; padding: 0 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .rp-bar .hint { flex: 1 1 220px; margin: 0; }
  .sheet-pg { width: 718px; margin: 12px auto 40px; background: #fff; padding: 28px 30px; box-sizing: content-box; box-shadow: 0 2px 14px rgba(0,0,0,.12); color: #1F2933; }
  .rp-h { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #1F2933; padding-bottom: 8px; }
  .rp-h .lg { display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 17px; }
  .rp-h .lg img { width: 26px; height: 26px; border-radius: 7px; }
  .rp-h .dt { font-size: 12px; color: #4B5563; }
  .rp-t { margin: 12px 0 2px; font-size: 21px; font-weight: 900; line-height: 1.35; }
  .rp-s { margin: 0 0 12px; font-size: 12.5px; color: #4B5563; }
  .rp-g { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 18px; align-items: start; }
  .rp-g.one { grid-template-columns: 1fr; }
  .rq { break-inside: avoid; page-break-inside: avoid; border: 1px solid #D9D4CA; border-radius: 10px; padding: 10px 12px; }
  .rq h3 { margin: 0 0 2px; font-size: 14.5px; line-height: 1.4; font-weight: 800; }
  .rq .m { margin: 0 0 8px; font-size: 11.5px; color: #6B7280; }
  .rr { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1px 8px; font-size: 12.5px; margin-bottom: 5px; }
  .rr .l { overflow-wrap: anywhere; }
  .rr .v { color: #374151; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .rr .b { grid-column: 1 / -1; height: 7px; border-radius: 4px; background: #EEEBE5; overflow: hidden; }
  .rr .b i { display: block; height: 100%; border-radius: 4px; background: #0F8B8D; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .rr.ok .l { font-weight: 800; } .rr.ok .b i { background: #E0A100; }
  .rr .ok-t { display: inline-block; margin-left: 4px; padding: 0 5px; border-radius: 4px; background: #E0A100; color: #fff; font-size: 10.5px; font-weight: 800; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .rw { display: flex; flex-wrap: wrap; gap: 4px 6px; font-size: 12.5px; }
  .rw span { border: 1px solid #D9D4CA; border-radius: 999px; padding: 1px 8px; }
  .rw b { color: #0B6E70; margin-left: 3px; }
  .rc { margin: 8px 0 0; padding: 0 0 0 16px; font-size: 11.5px; color: #374151; }
  .rc li { margin-bottom: 2px; }
  .rp-f { margin-top: 14px; border-top: 1px solid #D9D4CA; padding-top: 6px; font-size: 11px; color: #6B7280; display: flex; justify-content: space-between; }
  @media (max-width: 800px) { .sheet-pg { width: auto; margin: 10px; padding: 18px 16px; } .rp-g { grid-template-columns: 1fr; } }
  @page { size: A4; margin: 10mm; }
  @media print {
    body.rp { background: #fff; }
    .rp-bar { display: none; }
    .sheet-pg { width: auto; margin: 0; padding: 0; box-shadow: none; zoom: var(--z, 1); }
    .rp-g { grid-template-columns: 1fr 1fr; }
    .rp-g.one { grid-template-columns: 1fr; }
  }
  .qadd { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; width: 100%; margin-top: 12px; padding: 18px 12px; border: 2px dashed #C9CFD6; border-radius: 14px; background: transparent; color: var(--brand-dark); font: inherit; font-weight: 800; cursor: pointer; transition: background .15s, border-color .15s; }
  .qadd:hover, .qadd:focus-visible { background: #EAF6F3; border-color: var(--brand); }
  .qadd:disabled { opacity: .45; cursor: default; background: transparent; border-color: #C9CFD6; }
  .qadd-i { position: relative; width: 40px; height: 40px; border-radius: 50%; border: 2px solid currentColor; }
  .qadd-i::before, .qadd-i::after { content: ''; position: absolute; left: 50%; top: 50%; width: 18px; height: 2.5px; margin: -1.25px 0 0 -9px; border-radius: 2px; background: currentColor; }
  .qadd-i::after { transform: rotate(90deg); }
  .qlist { margin: 0 0 12px; padding-left: 22px; font-size: 15px; line-height: 1.6; color: var(--ink); }
  .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 6px; }
  .tab { font: inherit; font-weight: 800; padding: 9px 18px; min-height: 44px; border: 1.5px solid var(--line); border-radius: 999px; background: #fff; color: var(--ink-2); cursor: pointer; transition: background .15s, border-color .15s, color .15s; }
  .tab:hover { background: #E6F4F4; border-color: var(--brand); color: var(--brand-dark); }
  .tab:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
  .tab.on { background: var(--brand-dark); border-color: var(--brand-dark); color: #fff; }
  .tab.on:hover { background: var(--brand); border-color: var(--brand); color: #fff; }
  /* 퀴즈: 번호 고르기 · 번호별 표 */
  .who { display: inline-block; margin: 0 0 12px; padding: 5px 14px; border-radius: 999px; background: var(--brand-dark); color: #fff; font-weight: 800; font-size: 16px; }
  .b-seats { margin: -1vh 0 2vh; font-size: clamp(14px, 1.4vw, 24px); color: #C9D1DB; display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
  .b-seats span { display: inline-block; min-width: 2em; text-align: center; padding: .1em .4em; border-radius: .5em; background: #22363F; color: #F4F2EE; font-weight: 800; font-variant-numeric: tabular-nums; }
  .seats { display: grid; grid-template-columns: repeat(auto-fill, minmax(54px, 1fr)); gap: 8px; margin-top: 12px; }
  .b-seats span.gone { opacity: .28; text-decoration: line-through; }
  .b-alive { margin: 0 0 1.6vh; font-size: clamp(20px, 2.6vw, 44px); font-weight: 800; color: #F4F2EE; }
  .b-alive b { color: #7FE0C2; font-size: 1.5em; font-variant-numeric: tabular-nums; }

<script>

   자리: polls/{번호}/meta (질문·보기·열림), polls/{번호}/votes/{참여자 번호} = { c: 고른 보기, t: 한 줄 의견, at }

const VERSION = '2.5.0';
const MAX_POLLS = 100;   // 한 사람이 만들어 둘 수 있는 설문 수 (무료 저장 공간을 함께 쓰므로)

const $ = function(id){ return document.getElementById(id); };
const app = $('app');
const esc = function(v){ return String(v == null ? '' : v).replace(/[&<>"']/g, function(ch){ return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch]; }); };
const n = function(v){ return Number(v || 0).toLocaleString('ko-KR'); };
const CODE_RE = /^[a-z0-9]{6}$/;
const ALPHA = 'abcdefghjkmnpqrstuvwxyz23456789';   // 헷갈리는 글자(i·l·o·0·1) 뺌
const rnd = function(len, set){ const a = new Uint32Array(len); crypto.getRandomValues(a); let s = ''; for (let i = 0; i < len; i++) s += set[a[i] % set.length]; return s; };
const BASE = location.origin + location.pathname;
const joinUrl = function(code){ return BASE + '?p=' + code; };
const boardUrl = function(code){ return BASE + '?b=' + code; };
const reportUrl = function(code){ return BASE + '?r=' + code; };
const ls = { get: function(k){ try { return localStorage.getItem(k); } catch (e) { return null; } }, set: function(k, v){ try { localStorage.setItem(k, v); } catch (e) {} } };
const optsOf = function(meta){ const o = meta && meta.opts; if (!o) return []; return (Array.isArray(o) ? o : Object.keys(o).sort().map(function(k){ return o[k]; })).filter(function(x){ return x != null; }); };
const logo = '<a class="logo" href="' + esc(BASE) + '"><img src="icon.svg" alt="" width="64" height="64">헤아림<small>Hear<b>I&#39;m</b></small></a>';

/* ---- 주소로 바로 읽고 쓰기 (참여 화면) ---- */
function rest(path, opt){
  return fetch(CFG.databaseURL.replace(/\/$/, '') + '/' + path + '.json', opt || {}).then(function(r){
    return r.json().catch(function(){ return null; }).then(function(j){
      if (!r.ok) { const e = new Error(j && j.error || ('HTTP ' + r.status)); e.status = r.status; throw e; }
      return j;

}

/* ---- 적어서 내기(주관식) ---- */
// 묶음: 여러 질문을 이어 붙인 것. 묶음에 든 설문마다 sib(번호 순서 목록)와 flow(넘어가는 방식)를 가짐
const sibOf = function(meta){ return listOf(meta && meta.sib).filter(function(c){ return CODE_RE.test(c); }); };
const isText = function(meta){ return !!meta && meta.type === 'text'; };
const maxOf = function(meta){ return Math.min(5, Math.max(1, Number(meta && meta.max) || 1)); };
const listOf = function(o){ if (!o) return []; return Array.isArray(o) ? o : Object.keys(o).sort(function(a, b){ return a - b; }).map(function(k){ return o[k]; }); };
// 답에는 글자(한글·영어 등)와 숫자만 남김 — 기호·그림 문자는 뺌
const cleanAns = function(s){ let k = String(s == null ? '' : s); try { k = k.replace(new RegExp('[^\\p{L}\\p{N}\\s]', 'gu'), ''); } catch (e) { k = k.replace(/[!-\/:-@\[-`{-~]/g, ''); } return k.replace(/\s+/g, ' ').trim().slice(0, 20); };
const ansOf = function(v){ return listOf(v && v.a).filter(function(x){ return typeof x === 'string'; }).map(cleanAns).filter(Boolean); };
const hideOf = function(meta){ return listOf(meta && meta.hide).filter(function(x){ return typeof x === 'string' && x; }); };
// 같은 답으로 셀 기준: 띄어쓰기·문장부호·영어 대소문자만 다른 답
const normAns = function(s){ let k = String(s).toLowerCase(); try { k = k.replace(new RegExp('[\\s\\p{P}\\p{S}]', 'gu'), ''); } catch (e) { k = k.replace(/\s/g, ''); } return k || String(s).trim().toLowerCase(); };
// 거친 말 거르기: 걸러진 답은 지워지지 않고 화면에만 안 나옴 (만든 사람이 '보이기'로 되살릴 수 있음)
const BAD_RE = [
  /[시씨쓰쒸슈쉬씌][발벌빨팔뻘]/, /ㅅㅂ|ㅆㅂ|ㅂㅅ|ㅈㄹ|ㅈㄴ|ㅁㅊ|ㄲㅈ|ㄷㅊ/, /병신|븅신|빙신/, /지랄|쥐랄/, /새끼|새키|쉐끼|쌔끼|섀끼/,
  /좆|좃|졷|존나|졸라|줜나/, /개(같|새|소리|놈|년)/, /미친(놈|년|새)/, /닥쳐|꺼져|뒤져|뒈져|죽여버|죽어라/, /느금|니애미|엠창|니미럴/,
  /썅|쌍놈|쌍년|염병|엿먹|등신|찐따|또라이|돌아이/, /섹스|야동|변태/, /틀딱|급식충|맘충|김치녀|한남충/, /fuck|shit|bitch|porn|asshole|sex/
];
const BAD_WORD = { '자지': 1, '보지': 1, '섹': 1, 'ㅗ': 1, 'ㅗㅗ': 1 };
const isBad = function(s){
  let k = String(s == null ? '' : s).toLowerCase();
  try { k = k.replace(new RegExp('[^\\p{L}\\s]', 'gu'), ''); } catch (e) { k = k.replace(/[0-9!-\/:-@\[-`{-~]/g, ''); }
  const tok = k.split(/\s+/).filter(Boolean); if (!tok.length) return false;
  const hit = function(w){ return !!BAD_WORD[w] || BAD_RE.some(function(r){ return r.test(w); }); };
  // 낱말마다 살핌("다시 발표"는 통과). 한 글자씩 띄어 쓴 것("시 발")만 붙여서 한 번 더 살핌
  return tok.some(hit) || (tok.length > 1 && tok.every(function(w){ return w.length <= 1; }) && hit(tok.join('')));
};
const hashOf = function(s){ let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h; };
function tallyText(meta, votes){
  const hid = {}, allow = {}, map = {}, items = []; let total = 0;
  // hide 목록: 그냥 적힌 것은 숨긴 답, + 로 시작하면 걸러졌지만 만든 사람이 보이게 한 답
  hideOf(meta).forEach(function(k){ if (k.charAt(0) === '+') allow[k.slice(1)] = 1; else hid[k] = 1; });
  Object.keys(votes || {}).map(function(k){ return votes[k]; }).filter(function(v){ return v && ansOf(v).length; }).sort(function(a, b){ return (a.at || 0) - (b.at || 0); }).forEach(function(v){
    total++; const seen = {};
    ansOf(v).forEach(function(a){
      const k = normAns(a); if (seen[k]) return; seen[k] = 1; if (hid[k]) return;
      let it = map[k]; if (!it) { it = map[k] = { key: k, label: a, count: 0, forms: {} }; items.push(it); }
      it.count++; it.forms[a] = (it.forms[a] || 0) + 1; if (it.forms[a] > (it.forms[it.label] || 0)) it.label = a;
    });
  });
  const vis = [], flagged = [];
  // 확인한 뒤 띄우기(mod): 만든 사람이 띄운 답만 보임. 아니면 거친 말만 걸러 둠
  const mod = !!(meta && meta.mod);
  items.forEach(function(it){ if (allow[it.key]) vis.push(it); else if (mod || Object.keys(it.forms).some(isBad)) flagged.push(it); else vis.push(it); });
  return { total: total, items: vis, flagged: flagged, mod: mod, max: vis.reduce(function(m, i){ return Math.max(m, i.count); }, 0) };
}
const sizeOf = function(it, t){ return t.max > 1 ? Math.sqrt((it.count - 1) / (t.max - 1)) : .3; };
// 참여 화면용: 한 번 그리는 구름
function cloudHtml(t){
  if (!t.items.length) return '<p class="hint">아직 답이 없어요.</p>';
  return '<div class="cloud">' + t.items.slice().sort(function(a, b){ return b.count - a.count; }).slice(0, 40).map(function(it){
    return '<span class="w c' + (hashOf(it.key) % 3) + (t.max > 1 && it.count === t.max ? ' lead' : '') + '" style="--fs:' + (1 + 1.3 * sizeOf(it, t)).toFixed(2) + 'em">' + esc(it.label) + (it.count > 1 ? '<sup>' + it.count + '</sup>' : '') + '</span>';
  }).join('') + '</div>';
}
// 결과 화면용: 글자를 화면 여기저기에 흩어 놓음. 있던 글자는 제자리에서 커지고(겹치면 비켜 감), 새 답은 빈 곳에 새로 나타남
let cloudMeas = null;
function cloudUpdate(el, t, onPick){
  let list = t.items.map(function(it, i){ it.i = i; return it; });
  if (list.length > 60) list = list.slice().sort(function(a, b){ return b.count - a.count || b.i - a.i; }).slice(0, 60).sort(function(a, b){ return a.i - b.i; });
  const f = list.length > 40 ? .7 : list.length > 20 ? .85 : 1, have = {}, keep = {}, first = !el.dataset.on;
  el.dataset.on = '1';
  Array.prototype.forEach.call(el.children, function(c){ have[c.dataset.k] = c; });
  const W = el.clientWidth || 600, H = el.clientHeight || 300, vw = window.innerWidth / 100;
  if (!cloudMeas) { cloudMeas = document.createElement('span'); cloudMeas.className = 'cloud-meas'; document.body.appendChild(cloudMeas); }
  list.forEach(function(it){
    let w = have[it.key];
    if (!w) {
      w = document.createElement('button'); w.type = 'button'; w.className = 'w c' + (hashOf(it.key) % 3) + (first ? '' : ' new'); w.dataset.k = it.key;
      w.appendChild(document.createElement('span')); w.appendChild(document.createElement('sup'));
      w.addEventListener('click', function(){ onPick(it.key); }); el.appendChild(w);
    }
    keep[it.key] = 1; it.el = w;
    // 글자 크기(px)와 차지할 넓이를 미리 잼. 너무 길면 칸 안에 들어가게 줄임
    let px = Math.max(15, (1.9 + 3.4 * sizeOf(it, t)) * f * vw);
    cloudMeas.innerHTML = esc(it.label) + (it.count > 1 ? '<sup>' + it.count + '</sup>' : '');
    cloudMeas.style.fontSize = px + 'px'; let bw = cloudMeas.offsetWidth;
    if (bw > W * .92) { px = Math.max(12, px * W * .92 / bw); cloudMeas.style.fontSize = px + 'px'; bw = cloudMeas.offsetWidth; }
    it.w = bw; it.h = cloudMeas.offsetHeight;
    w.style.setProperty('--fs', px.toFixed(1) + 'px');
    w.classList.toggle('lead', t.max > 1 && it.count === t.max);
    w.firstChild.textContent = it.label; w.lastChild.textContent = it.count > 1 ? it.count : '';
    w.setAttribute('aria-label', it.label + ' ' + it.count + '명');
  });
  Object.keys(have).forEach(function(k){ if (!keep[k]) have[k].remove(); });
  // 자리 잡기: 큰 글자부터. 제자리가 비어 있으면 그대로, 겹치면 빈 곳을 찾아 옮김
  const placed = [], gap = 10;
  const over = function(x, y, it){ let o = 0; for (let k = 0; k < placed.length; k++) { const p = placed[k], dx = (it.w + p.w) / 2 + gap - Math.abs(x - p.x), dy = (it.h + p.h) / 2 + gap - Math.abs(y - p.y); if (dx > 0 && dy > 0) o += dx * dy; } return o; };
  const clamp = function(v, half, size){ return size <= half * 2 ? size / 2 : Math.min(size - half, Math.max(half, v)); };
  list.slice().sort(function(a, b){ return b.count - a.count || a.i - b.i; }).forEach(function(it){
    const w = it.el, old = w._p; let x = 0, y = 0, ok = false;
    if (old) { x = clamp(old.x * W, it.w / 2, W); y = clamp(old.y * H, it.h / 2, H); ok = !over(x, y, it); }
    if (!ok) {
      let best = Infinity, bx = W / 2, by = H / 2;
      for (let n = 0; n < 260; n++) {
        const spread = Math.min(1, .35 + n / 120);
        const cx = clamp(W / 2 + (Math.random() - .5) * W * spread, it.w / 2, W), cy = clamp(H / 2 + (Math.random() - .5) * H * spread, it.h / 2, H), o = over(cx, cy, it);
        if (o < best) { best = o; bx = cx; by = cy; if (!o) break; }
      }
      x = bx; y = by;
    }
    w._p = { x: x / W, y: y / H }; placed.push({ x: x, y: y, w: it.w, h: it.h });
    w.style.left = (x / W * 100).toFixed(2) + '%'; w.style.top = (y / H * 100).toFixed(2) + '%';
  });
}

// 퀴즈: 정답은 만든 사람만 읽는 칸(keys)에 따로 두고, '정답 보이기'를 누르면 meta.rev 에 적혀 모두에게 보임
// 퀴즈(번호 입장): qz 는 'solo'(혼자 풀기) 또는 'bell'(골든벨). 번호·점수는 묶음의 첫 질문 번호(root) 아래에 둠
const qzOf = function(meta){ return meta && (meta.qz === 'solo' || meta.qz === 'bell') ? meta.qz : ''; };
const seatsOf = function(meta){ return Math.min(40, Math.max(1, Number(meta && meta.seats) || 30)); };
const rootOf = function(meta, code){ return sibOf(meta)[0] || code; };
const revOf = function(meta){ return meta && typeof meta.rev === 'number' ? meta.rev : -1; };
const OKT = '<em class="okt">정답</em>';

/* ---- 표 세기 ---- */
// 한 사람이 고른 보기 번호들: 하나 고르기는 c, 여러 개 고르기는 m(목록)
function picksOf(v, len){
  if (!v) return [];
  if (typeof v.c === 'number') return v.c >= 0 && v.c < len ? [v.c] : [];
  const out = []; listOf(v.m).forEach(function(x){ x = Number(x); if (x >= 0 && x < len && Math.floor(x) === x && out.indexOf(x) < 0) out.push(x); });
  return out.sort(function(a, b){ return a - b; });
}
function tally(meta, votes){
  const opts = optsOf(meta), counts = opts.map(function(){ return 0; }), cmts = []; let total = 0, sum = 0;
  Object.keys(votes || {}).forEach(function(k){
    const v = votes[k], p = picksOf(v, opts.length); if (!p.length) return;
    total++; sum += p.length; p.forEach(function(i){ counts[i]++; });
    if (v.t && String(v.t).trim() && !isBad(v.t)) cmts.push({ t: String(v.t).trim(), c: p[0], lab: p.map(function(i){ return opts[i]; }).join(', '), at: v.at || 0 });

function armed(btn, text, run){
  const orig = btn.textContent; let t = 0;
  btn.addEventListener('click', function(){
    if (btn.classList.contains('armed')) { clearTimeout(t); btn.classList.remove('armed'); btn.textContent = orig; run(); return; }
    btn.classList.add('armed'); btn.textContent = text;
    t = setTimeout(function(){ btn.classList.remove('armed'); btn.textContent = orig; }, 3000);
  });
}

      }
      const t = tally(m, votes[i]); most = Math.max(most, t.total);
      let ak = revOf(m); if (ak < 0 && typeof keys[c] === 'number') ak = keys[c]; if (ak < 0 && d.ans && typeof d.ans[i] === 'number' && d.ans[i] >= 0) ak = d.ans[i];
      const kind = qz ? '퀴즈' : (m.multi ? '여러 개 고르기' + (Number(m.max) >= 2 ? '(' + Math.min(5, Number(m.max)) + '개까지)' : '') : '하나 고르기');
      const okN = ak >= 0 ? t.counts[ak] || 0 : -1;
      return '<div class="rq"><h3>' + (i + 1) + '. ' + esc(m.q) + '</h3><p class="m">' + kind + ' · ' + n(t.total) + '명' + (okN >= 0 && t.total ? ' · 정답률 ' + Math.round(okN / t.total * 100) + '%' : '') + '</p>' +
        t.opts.map(function(o, k){ const c2 = t.counts[k], pct = t.total ? Math.round(c2 / t.total * 100) : 0; return '<div class="rr' + (k === ak ? ' ok' : '') + '"><span class="l">' + esc(o) + (k === ak ? '<span class="ok-t">정답</span>' : '') + '</span><span class="v">' + n(c2) + '명 · ' + pct + '%</span><span class="b"><i style="width:' + pct + '%"></i></span></div>'; }).join('') +
        (t.cmts.length ? '<ul class="rc">' + t.cmts.slice(0, 6).map(function(x){ return '<li>' + esc(x.t) + '</li>'; }).join('') + (t.cmts.length > 6 ? '<li>그 밖에 ' + (t.cmts.length - 6) + '개</li>' : '') + '</ul>' : '') + '</div>';
    });
    let dist = '';
    if (d.dist && listOf(d.dist.d).length) {
      const dd = listOf(d.dist.d).map(Number), tot = dd.reduce(function(a, b){ return a + b; }, 0);
      dist = '<div class="rq" style="margin-top:12px"><h3>맞은 개수별 사람 수</h3><p class="m">' + n(tot) + '명 · ' + (dd.length - 1) + '문제</p>' +
        dd.map(function(c2, k){ const pct = tot ? Math.round(c2 / tot * 100) : 0; return '<div class="rr"><span class="l">' + k + '개</span><span class="v">' + n(c2) + '명 · ' + pct + '%</span><span class="b"><i style="width:' + pct + '%"></i></span></div>'; }).reverse().join('') + '</div>';
    }
    const m0 = metas[0] || {}, now = new Date();
    $('rps').innerHTML = '<div class="rp-h"><span class="lg"><img src="icon.svg" alt="">헤아림 <small style="font-weight:600;color:#6B7280">결과지</small></span><span class="dt">' + esc(now.toLocaleString('ko-KR', { dateStyle: 'long', timeStyle: 'short' })) + ' 기준</span></div>' +
      '<p class="rp-t">' + esc(m0.q || '') + (sb.length > 1 ? ' <span style="font-weight:600;color:#6B7280;font-size:.7em">외 ' + (sb.length - 1) + '개</span>' : '') + '</p>' +
      '<p class="rp-s">설문 번호 ' + esc(sb[0]) + ' · 질문 ' + sb.length + '개 · 답한 사람 ' + n(most) + '명' + (qzOf(m0) === 'solo' ? ' · 혼자 풀기 퀴즈' : qzOf(m0) === 'bell' ? ' · 골든벨' : '') + (m0.open === false ? ' · 마감' : ' · 받는 중') + '</p>' +
      '<div class="rp-g' + (sb.length < 2 ? ' one' : '') + '">' + blocks.join('') + '</div>' + dist +
      '<div class="rp-f"><span>헤아림 HearI&#39;m · musicalpe.github.io/hearim</span><span>이름 없이 모은 답이에요</span></div>';
    fit();
  };
  $('rpp').addEventListener('click', function(){ fit(); window.print(); });
  $('rpf').addEventListener('change', fit);
  window.addEventListener('beforeprint', fit);
  rest('polls/' + code + '/meta').then(function(m){
    if (!m || !m.q) { $('rps').innerHTML = '<p class="msg bad">설문을 찾지 못했어요.</p>'; return; }
    const sb = sibOf(m).length && sibOf(m).indexOf(code) >= 0 ? sibOf(m) : [code], root = sb[0];
    return Promise.all([
      Promise.all(sb.map(function(c){ return rest('polls/' + c + '/meta').catch(function(){ return null; }); })),
      Promise.all(sb.map(function(c){ return rest('polls/' + c + '/votes').catch(function(){ return null; }); })),
      qzOf(m) ? rest('scores/' + root + '/dist').catch(function(){ return null; }) : null,
      qzOf(m) ? rest('scores/' + root + '/ans').catch(function(){ return null; }) : null
    ]).then(function(a){
      document.title = '헤아림 · 결과지 · ' + ((a[0][0] || {}).q || '');
      data = { sb: sb, metas: a[0], votes: a[1], dist: a[2], ans: a[3] ? listOf(a[3]).map(Number) : null }; render();
      // 만든 사람이면 정답 칸도 읽어서 표시
      loadFb().then(function(fb){
        fb.auth().onAuthStateChanged(function(u){
          if (!u || !a[0].some(function(x){ return x && x.owner === u.uid; })) return;
          Promise.all(sb.map(function(c){ return fb.database().ref('keys/' + c).once('value').then(function(k){ return k.val(); }).catch(function(){ return null; }); })).then(function(ks){
            ks.forEach(function(k, i){ if (k && typeof k.a === 'number') keys[sb[i]] = k.a; }); render();
          });
        });
      }).catch(function(){});
    });
  }).catch(function(){ $('rps').innerHTML = '<p class="msg bad">불러오지 못했어요. 인터넷을 확인하고 새로고침해 주세요.</p>'; });
}

/* ---- 시작 ---- */
(function(){
  if (!CFG || !CFG.databaseURL) { app.innerHTML = '<div class="top">' + logo + '</div><div class="card"><h1>아직 연결 전이에요</h1><p class="hint">파이어베이스 연결 정보(config.js)를 넣으면 쓸 수 있어요.</p></div>'; return; }
  const p = (Q.get('p') || '').toLowerCase(), b = (Q.get('b') || '').toLowerCase(), r = (Q.get('r') || '').toLowerCase();
  if (CODE_RE.test(r)) pageReport(r); else if (CODE_RE.test(b)) pageBoard(b); else if (CODE_RE.test(p)) pageJoin(p); else pageHome();
})();
</script>
